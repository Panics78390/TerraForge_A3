name: Application Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: TerraForge-Windows
          path: release/*.exe
      - name: Lire le numéro de version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TerraForge ${{ steps.v.outputs.version }}
          body: |
            Application Windows de TerraForge.
            - **TerraForge-Installation** : installe le logiciel (raccourci dans le menu Démarrer).
            - **TerraForge-Portable** : un seul fichier à lancer, sans installation.
