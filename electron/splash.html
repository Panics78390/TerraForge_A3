<!doctype html>
<meta charset="utf-8">
<title>TerraForge</title>
<style>
  html, body { margin: 0; height: 100%; background: #050910; overflow: hidden; }
  .frame { position: relative; height: 100%; }
  img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .veil {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(4, 12, 22, 0.16) 3px 4px);
    box-shadow: inset 0 0 0 1px rgba(62, 224, 240, 0.55), inset 0 0 60px rgba(8, 30, 52, 0.28);
  }
  .corner {
    position: absolute; width: 26px; height: 26px; pointer-events: none;
    border: 2px solid #3ee0f0;
    filter: drop-shadow(0 0 6px rgba(62, 224, 240, 0.85));
  }
  .tl { top: 14px; left: 14px; border-right: 0; border-bottom: 0; }
  .tr { top: 14px; right: 14px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 14px; left: 14px; border-right: 0; border-top: 0; }
  .br { bottom: 14px; right: 14px; border-left: 0; border-top: 0; }
</style>
<div class="frame">
  <img src="../build/splash.jpg" alt="TerraForge">
  <div class="veil"></div>
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
</div>
